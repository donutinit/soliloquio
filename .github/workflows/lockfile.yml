name: Lockfile

on:
  workflow_dispatch:
    inputs:
      update:
        description: Also update every dependency to the newest version its package.json range allows
        type: boolean
        default: false
      before:
        description: With update, only versions published before this date (YYYY-MM-DD; empty is 7 days ago)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Resolve package-lock.json
        env:
          UPDATE: ${{ inputs.update }}
          BEFORE: ${{ inputs.before }}
        run: |
          set -euo pipefail
          if [[ "$UPDATE" == true ]]; then
            before=${BEFORE:-$(date -u -d '7 days ago' +%F)}
            if [[ ! "$before" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "before must be a YYYY-MM-DD date" >&2
              exit 1
            fi
            echo "Updating to versions published before $before"
            npm update --package-lock-only --ignore-scripts --before="$before"
          else
            npm install --package-lock-only --ignore-scripts
          fi
          git diff --exit-code package.json
          git diff --stat package-lock.json
          npm audit --package-lock-only || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-lock
          path: package-lock.json
