name: soliloquio
services:
  soliloquio:
    image: ${SOLILOQUIO_IMAGE}
    restart: unless-stopped
    ports:
      - "45543:80"
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/config, /data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
